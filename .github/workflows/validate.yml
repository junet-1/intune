name: Validate scripts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path PlatformScripts, Remediations -Filter *.ps1 -Recurse | ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  $failed = $true
                  Write-Error "$($_.FullName): $($errors -join '; ')"
              }
          }
          if ($failed) { exit 1 }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path PlatformScripts, Remediations -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Apps/requirements.txt

      - name: Install dependencies
        run: pip install -r Apps/requirements.txt

      - name: Compile Python sources
        run: python -m py_compile Apps/Build-IntuneWin.py
